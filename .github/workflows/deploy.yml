name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-frontend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ROLE_ARN: arn:aws:iam::676928793658:role/realty-adwise-github-deploy-web
  BUCKET: realty-adwise-deploy-676928793658
  INSTANCE_ID: i-04fa12a2042d8597c

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload release bundle
        run: |
          REL=$(git rev-parse --short=12 HEAD)
          echo "REL=$REL" >> "$GITHUB_ENV"
          git archive --format=tar.gz -o release.tgz HEAD
          aws s3 cp --quiet release.tgz "s3://$BUCKET/frontend/$REL.tgz"

      - name: Deploy on server
        run: |
          CID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "github: deploy frontend $REL (run $GITHUB_RUN_ID)" \
            --timeout-seconds 1200 \
            --parameters "{\"commands\":[\"/usr/local/bin/realty-deploy frontend s3://$BUCKET/frontend/$REL.tgz $REL\"],\"executionTimeout\":[\"1200\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command $CID"
          STATUS=Pending
          for _ in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text >&2
          echo "Deploy status: $STATUS"
          [ "$STATUS" = "Success" ]
